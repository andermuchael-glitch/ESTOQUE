<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b72ff">
  <title>ESTOQUE — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#05090f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(460px,100%);padding:32px;border:1px solid #223146;border-radius:24px;background:#0a111a;text-align:center;box-shadow:0 20px 70px #0008}.icon{width:68px;height:68px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:#0b1c3a;border:1px solid #1683ff;font-size:32px}.card h1{margin:0 0 8px;font-size:25px}.card p{margin:0;color:#8d99a8;line-height:1.6;font-size:14px}.back{display:inline-block;margin-top:22px;padding:12px 18px;border-radius:11px;background:#1683ff;color:white;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📦</div>
    <h1>Você está offline</h1>
    <p>O ESTOQUE continua funcionando localmente. Volte ao aplicativo quando a página já estiver em cache ou reconecte a internet para atualizar os dados.</p>
    <a class="back" href="/ESTOQUE/">Voltar ao ESTOQUE</a>
  </main>
</body>
</html>
